[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "information-landscape-sculpting"
version = "0.1.0"
description = "Offline simulator for testing aggregate research-frontier reconstruction."
requires-python = ">=3.10"

[project.scripts]
ils-simulate = "ils_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
